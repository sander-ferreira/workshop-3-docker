# Reverse-proxy : seul point d'entrée du projet (port 80)
#   /        -> front_users
#   /admin/  -> front_admin
#   /api/    -> api

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent -> $upstream_addr';
    access_log /var/log/nginx/access.log main;

    # DNS interne de Docker : les noms de services (api, front_admin...) sont
    # résolus à chaque requête, donc un conteneur recréé (nouvelle IP) reste joignable
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;
        absolute_redirect off;  # redirections relatives : on garde l'hôte et le port du navigateur

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Healthcheck du proxy lui-même
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # API : l'URL est transmise telle quelle (/api/admin/..., /api/users/...)
        location /api/ {
            set $api http://api:5000;
            proxy_pass $api;
        }

        # Front administrateur : on retire le préfixe /admin avant de transmettre
        location /admin/ {
            set $front_admin http://front_admin:80;
            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass $front_admin;
        }
        location = /admin { return 301 /admin/; }

        # Front utilisateurs : tout le reste
        location / {
            set $front_users http://front_users:80;
            proxy_pass $front_users;
        }
    }
}
