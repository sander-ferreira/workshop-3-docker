name: workshop3

services:
  db:
    image: mysql:8.4.13
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

  # Applique les migrations et s'arrête
  migrations:
    image: flyway/flyway:13.11.1
    container_name: migrations
    command: migrate
    environment:
      FLYWAY_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false
      FLYWAY_USER: root
      FLYWAY_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  api:
    build: ./api
    image: workshop3/api:1.0.0
    container_name: api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    expose:
      - "5000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.services.api.loadbalancer.server.port=5000"
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - frontend
      - backend

  front_admin:
    build: ./front_admin
    image: workshop3/front-admin:1.0.0
    container_name: front_admin
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Path(`/admin`) || PathPrefix(`/admin/`)"
      # /admin -> /admin/ (sinon style.css et app.js seraient demandés à la racine), puis retrait du préfixe
      - "traefik.http.routers.admin.middlewares=admin-slash,admin-strip"
      - "traefik.http.middlewares.admin-slash.redirectregex.regex=^(.*)/admin$$"
      - "traefik.http.middlewares.admin-slash.redirectregex.replacement=$${1}/admin/"
      - "traefik.http.middlewares.admin-slash.redirectregex.permanent=true"
      - "traefik.http.middlewares.admin-strip.stripprefix.prefixes=/admin"
      - "traefik.http.services.admin.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontend

  front_users:
    build: ./front_users
    image: workshop3/front-users:1.0.0
    container_name: front_users
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.users.rule=PathPrefix(`/`)"
      - "traefik.http.services.users.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontend

  reverse_proxy:
    image: traefik:v3.7.16
    container_name: reverse_proxy
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=workshop3_frontend
      - --ping=true
      - --ping.entrypoint=web
      - --accesslog=true
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
      front_admin:
        condition: service_healthy
      front_users:
        condition: service_healthy
    networks:
      - frontend

networks:
  frontend:
  backend:
    internal: true

volumes:
  db_data:
